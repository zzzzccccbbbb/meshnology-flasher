name = "meshnology-flasher"
compatibility_date = "2025-09-01"
pages_build_output_dir = "dist"

# R2 bucket for firmware catalog + .bin files.
# Created in Day 2 via `wrangler r2 bucket create meshnology-flasher-firmware`.
# Bind name "FIRMWARE" is referenced from functions/ handlers as
#   env.FIRMWARE.head(...) / env.FIRMWARE.get(...)
[[r2_buckets]]
binding = "FIRMWARE"
bucket_name = "meshnology-flasher-firmware"
preview_bucket_name = "meshnology-flasher-firmware-preview"

# NOTE: Cloudflare Pages does NOT read [build] from wrangler.toml.
# Build command and output directory are configured in the Cloudflare
# Dashboard under the Pages project settings:
#   Framework preset: Vite
#   Build command:     npm run build
#   Build output dir:  dist
#
# Owner action items:
#   1. Cloudflare Dashboard -> Workers & Pages -> meshnology-flasher
#      -> Settings -> Builds & deployments -> set the three fields above
#   2. R2 bucket creation (Day 2):
#        wrangler r2 bucket create meshnology-flasher-firmware
#   3. Custom domain flasher.mesh.com (any time after first deploy)
